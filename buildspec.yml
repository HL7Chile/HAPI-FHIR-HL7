version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
  build:
    commands:
      - echo Building config file...
      - |
        cat > "hapi-fhir-jpaserver-starter/src/main/resources/application.yaml" <<- EOM
        server:
          port: $SERVER_PORT
          tomcat:
            relaxed-query-chars: "|"

        management:
          endpoints:
            enabled-by-default: false
            web:
              exposure:
                include: "health"  # or "info,health,prometheus,metrics" or "*" for all
          endpoint:
            info:
              enabled: true
            metrics:
              enabled: true
            health:
              enabled: true
              probes:
                enabled: true
              group:
                liveness:
                  include: [ "livenessState", "readinessState" ]
            prometheus:
              enabled: true
          prometheus:
            metrics:
              export:
                enabled: true

        spring:

          main:
            allow-bean-definition-overriding: false
            allow-circular-references: true

          autoconfigure:
          
            exclude: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

          flyway:
            enabled: false
            baseline-on-migrate: true
            fail-on-missing-locations: false

          datasource:
            url: 'jdbc:postgresql://$DB_HOST:$DB_PORT/$DB_DATABASE'
            username: $DB_USERNAME
            password: $DB_PASSWORD
            driver-class-name: org.postgresql.Driver
            max-active: 15    
            hikari:
              maximum-pool-size: 10

          jpa:
            properties:
              hibernate:
                format_sql: false
                show_sql: false
                dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect

                hbm2ddl:
                  auto: update
                jdbc:
                  batch_size: 20
                cache:
                  use_query_cache: false
                  use_second_level_cache: false
                  use_structured_entries: false
                  use_minimal_puts: false

                search:
                  enabled: false

        hapi:
          fhir:
            openapi_enabled: true                       
            fhir_version: R4                           

            # server_address: http://hapi.fhir.org/baseR4

            ig_runtime_upload_enabled: true
            install_transitive_ig_dependencies: true
            implementationguides:
              clcore:
                name: hl7.fhir.cl.clcore
                version: 1.9.4
                installMode: STORE_AND_INSTALL
                reloadExisting: false
              
              InternationalPatientSummaryChile:
                name: hl7.fhir.cl.clips
                version: 0.4.0
                reloadExisting: false
                installMode: STORE_AND_INSTALL
              
              InternationalPatientSummaryIG:
                name: hl7.fhir.uv.ips
                version: 2.0.0
                reloadExisting: false
                installMode: STORE_AND_INSTALL

            cr:
              enabled: false                           
              caregaps:
                reporter: "default"
                section_author: "default"
              terminologyServerClientSettings:
                maxRetryCount: 3
                retryIntervalMillis: 1000
                timeoutSeconds: 30
                socketTimeout: 60
              cql:
                use_embedded_libraries: true
                compiler:
                  error_level: Info
                  signature_level: All
                  enable_annotations: true
                  enable_locators: true
                  enable_results_type: true
                  enable_detailed_errors: true

                runtime:
                  debug_logging_enabled: false

              terminology:
                valueset_preexpansion_mode: REQUIRE            
                valueset_expansion_mode: PERFORM_NAIVE_EXPANSION   
                valueset_membership_mode: USE_EXPANSION           
                code_lookup_mode: USE_VALIDATE_CODE_OPERATION      
              data:
                search_parameter_mode: USE_SEARCH_PARAMETERS      
                terminology_parameter_mode: FILTER_IN_MEMORY
                profile_mode: DECLARED                             
            cdshooks:
              enabled: false
              clientIdHeaderName: client_id

            search_index_full_text_enabled: false

            bulk_export_enabled: false
            bulk_import_enabled: false

            mdm_enabled: false
            mdm_rules_json_location: "mdm-rules.json"

            logical_urls:
              - http://terminology.hl7.org/*
              - https://terminology.hl7.org/*
              - http://snomed.info/*
              - https://snomed.info/*
              - http://unitsofmeasure.org/*
              - https://unitsofmeasure.org/*
              - http://loinc.org/*
              - https://loinc.org/*

            custom-bean-packages: server.HL7Chile
            custom-interceptor-classes: server.HL7Chile.CustomCapabilityStatementInterceptor
          
            tester:
              home:
                name: IPS-Server-HL7
                server_address: 'http://localhost:$SERVER_PORT/fhir'
                refuse_to_fetch_third_party_urls: false
                fhir_version: R4

        EOM
      - cat "hapi-fhir-jpaserver-starter/src/main/resources/application.yaml"
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - docker build --no-cache -t $REPO_NAME:$IMAGE_TAG .
      - docker tag $REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPO_NAME:$IMAGE_TAG
      - docker tag $REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPO_NAME:latest 
  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPO_NAME:$IMAGE_TAG
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPO_NAME:$IMAGE_TAG
      - echo '[{"name":"'$REPO_NAME'","imageUri":"'$IMAGE_URI'"}]'
      - printf '[{"name":"'$REPO_NAME'","imageUri":"'$IMAGE_URI'"}]' > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
